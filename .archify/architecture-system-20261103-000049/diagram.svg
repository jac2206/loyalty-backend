    <text x="400" y="340" class="t-muted" font-size="10" text-anchor="middle">Express 5 + TypeScript · REST</text>
  </g>
  <g data-edge-from="api" data-edge-to="security">
    <line x1="400" y1="285" x2="400" y2="207" class="a-security" stroke-width="1.7" marker-end="url(#arrow-security)"/>
    <text x="414" y="247" class="t-security" font-size="8">Rutas protegidas</text>
  </g>
  <g data-node-id="security">
    <rect x="300" y="112" width="200" height="96" rx="8" class="c-mask"/>
