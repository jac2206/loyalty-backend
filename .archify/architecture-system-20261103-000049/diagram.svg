    <text x="400" y="143" class="t-primary" font-size="12" font-weight="600" text-anchor="middle">Autenticación y scopes</text>
    <text x="400" y="166" class="t-muted" font-size="10" text-anchor="middle">JWT Bearer · HS256</text>
    <text x="400" y="186" class="t-security" font-size="9" text-anchor="middle">Selectivo por ruta</text>
  </g>
  <g data-edge-from="api" data-edge-to="usecases">
