<svg viewBox="0 0 1240 650" role="img" aria-label="Arquitectura general del sistema Loyalty">
  <defs>
    <marker id="arrow-default" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="m-default"/>
    </marker>
    <marker id="arrow-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="m-security"/>
    </marker>
  </defs>
  <g data-node-id="web">
    <rect x="30" y="145" width="195" height="82" rx="8" class="c-mask"/>
    <rect x="30" y="145" width="195" height="82" rx="8" class="c-frontend" stroke-width="1.5"/>
    <text x="127" y="175" class="t-primary" font-size="13" font-weight="600" text-anchor="middle">Cliente web</text>
    <text x="127" y="198" class="t-muted" font-size="10" text-anchor="middle">loyalty-web · Next.js reportado</text>
    <text x="127" y="215" class="t-frontend" font-size="8" text-anchor="middle">Implementación externa no verificada</text>
  </g>
  <g data-edge-from="web" data-edge-to="api">
    <path d="M 225 186 L 270 186 Q 290 186 290 206 L 290 285" class="a-default" stroke-width="1.7" marker-end="url(#arrow-default)"/>
    <text x="256" y="174" class="t-muted" font-size="8" text-anchor="middle">REST · reportado</text>
  </g>
  <g data-node-id="mobile">
    <rect x="30" y="455" width="200" height="88" rx="8" class="c-mask"/>
    <rect x="30" y="455" width="200" height="88" rx="8" class="c-frontend" stroke-width="1.5"/>
    <text x="130" y="485" class="t-primary" font-size="13" font-weight="600" text-anchor="middle">Cliente móvil</text>
    <text x="130" y="508" class="t-muted" font-size="10" text-anchor="middle">loyalty-movile · React Native</text>
    <text x="130" y="528" class="t-frontend" font-size="8" text-anchor="middle">APK reportado · código no verificado</text>
  </g>
  <g data-edge-from="mobile" data-edge-to="api">
