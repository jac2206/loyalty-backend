  </g>
  <g data-edge-from="usecases" data-edge-to="repositories">
    <line x1="775" y1="325" x2="820" y2="325" class="a-default" stroke-width="1.7" marker-end="url(#arrow-default)"/>
    <text x="797" y="311" class="t-muted" font-size="8" text-anchor="middle">persistencia</text>
  </g>
  <g data-node-id="repositories">
    <rect x="830" y="285" width="178" height="80" rx="8" class="c-mask"/>
    <rect x="830" y="285" width="178" height="80" rx="8" class="c-backend" stroke-width="1.5"/>
    <text x="919" y="316" class="t-primary" font-size="13" font-weight="600" text-anchor="middle">Repositorios</text>
    <text x="919" y="340" class="t-muted" font-size="10" text-anchor="middle">PostgreSQL · pg Pool</text>
  </g>
  <g data-edge-from="repositories" data-edge-to="postgres">
    <line x1="1008" y1="325" x2="1052" y2="325" class="a-default" stroke-width="1.7" marker-end="url(#arrow-default)"/>
    <text x="1029" y="311" class="t-muted" font-size="8" text-anchor="middle">SQL</text>
  </g>
  <g data-node-id="postgres">
    <rect x="1060" y="285" width="160" height="80" rx="8" class="c-mask"/>
    <rect x="1060" y="285" width="160" height="80" rx="8" class="c-database" stroke-width="1.5"/>
    <text x="1140" y="316" class="t-primary" font-size="13" font-weight="600" text-anchor="middle">PostgreSQL</text>
    <text x="1140" y="340" class="t-muted" font-size="9" text-anchor="middle">Proveedor no verificado</text>
  </g>
  <g data-edge-from="usecases" data-edge-to="poke_adapter">
    <line x1="670" y1="365" x2="670" y2="463" class="a-default" stroke-width="1.7" marker-end="url(#arrow-default)"/>
    <text x="684" y="419" class="t-muted" font-size="9">Módulo generic</text>
  </g>
  <g data-node-id="poke_adapter">
    <rect x="565" y="470" width="210" height="80" rx="8" class="c-mask"/>
    <rect x="565" y="470" width="210" height="80" rx="8" class="c-backend" stroke-width="1.5"/>
    <text x="670" y="501" class="t-primary" font-size="13" font-weight="600" text-anchor="middle">PokeApiAdapter</text>
    <text x="670" y="525" class="t-muted" font-size="10" text-anchor="middle">Cliente Axios · timeout 4 s</text>
  </g>
  <g data-edge-from="poke_adapter" data-edge-to="pokeapi">
    <line x1="775" y1="510" x2="820" y2="510" class="a-default" stroke-width="1.7" marker-end="url(#arrow-default)"/>
    <text x="797" y="496" class="t-muted" font-size="8" text-anchor="middle">HTTP GET</text>
  </g>
  <g data-node-id="pokeapi">
    <rect x="830" y="470" width="178" height="80" rx="8" class="c-mask"/>
    <rect x="830" y="470" width="178" height="80" rx="8" class="c-external" stroke-width="1.5"/>
    <text x="919" y="501" class="t-primary" font-size="13" font-weight="600" text-anchor="middle">PokeAPI</text>
    <text x="919" y="525" class="t-muted" font-size="9" text-anchor="middle">Servicio externo</text>
  </g>
  <text x="35" y="608" class="t-muted" font-size="10">Los clientes web/móvil son declarados; el backend y la integración PokeAPI están respaldados por código. Hosting y estado operativo no se muestran.</text>
</svg>
